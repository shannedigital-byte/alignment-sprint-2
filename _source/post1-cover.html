<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-embedded.css">
<style>
  :root{--pink:#FF30CC;--lime:#CCFD28;--cream:#FCF7ED;--ink:#282826;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  body{background:var(--ink);font-family:'DM Sans',sans-serif;color:var(--ink);overflow:hidden;position:relative}
  .frame{position:absolute;inset:0;padding:86px 84px 70px;display:flex;flex-direction:column}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .wordmark{font-family:'Fraunces',serif;font-weight:900;font-style:italic;font-size:32px;color:var(--pink)}
  .swipe{font-weight:700;font-size:22px;color:var(--lime)}
  .big{font-family:'Fraunces',serif;font-weight:900;letter-spacing:-.012em}
</style></head><body>
<div class="frame">
  <div style="height:6px"></div>
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center">
    <div class="big" style="font-size:100px;line-height:1.0;color:var(--cream)">Things<br>nobody taught<br>you about <span style="color:var(--pink)">female<br>pleasure.</span></div>
    <div style="margin-top:38px;font-size:29px;font-weight:500;color:var(--cream);max-width:820px;line-height:1.4;opacity:.9">
      Eight things worth knowing about your own body.</div>
  </div>
  <svg width="180" height="132" viewBox="0 0 150 110" style="position:absolute;right:70px;top:120px;opacity:.14" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 55C20 27 42 14 75 14C108 14 130 27 130 55C130 83 108 96 75 96C42 96 20 83 20 55Z" fill="#FF30CC"/>
    <path d="M20 50 Q6 44 2 48 Q7 60 21 62 Q19 55 20 50Z" fill="#FF30CC"/>
    <path d="M130 50 Q144 44 148 48 Q143 60 129 62 Q131 55 130 50Z" fill="#FF30CC"/>
  </svg>
  <svg width="90" height="90" viewBox="0 0 90 90" style="position:absolute;right:120px;top:280px;opacity:.16" xmlns="http://www.w3.org/2000/svg">
    <g fill="#CCFD28"><circle cx="30" cy="20" r="16"/><circle cx="55" cy="18" r="15"/><circle cx="20" cy="42" r="15"/><circle cx="45" cy="44" r="17"/><circle cx="68" cy="38" r="14"/><circle cx="33" cy="65" r="15"/><circle cx="58" cy="64" r="15"/></g>
  </svg>
  <div class="foot">
    <span class="wordmark">Nancy</span>
    <span class="swipe">swipe &rarr;</span>
  </div>
</div>
</body></html>
